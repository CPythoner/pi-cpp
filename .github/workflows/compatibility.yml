name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-v0-80-differential:
    name: pi-v0.80.0 differential
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pi-cpp
        uses: actions/checkout@v4

      - name: Checkout pi v0.80.0 exact commit
        uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          ref: f08e968c83d92bce5f5fd2f7f20ef37f8cf04a39
          path: .reference/pi
          fetch-depth: 1

      - name: Set up Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: .reference/pi/package-lock.json

      - name: Install pi reference dependencies
        working-directory: .reference/pi
        run: npm ci --ignore-scripts

      - name: Configure pi-cpp
        run: cmake --preset release

      - name: Build pi-cpp reference runner
        run: cmake --build --preset release --target pi_reference_trace --parallel

      - name: Run differential traces
        run: >-
          python3 tests/reference/run_differential.py
          --pi-root .reference/pi
          --cpp-runner build/release/tests/pi_reference_trace
          --output-dir build/reference-traces
          --fixture-dir tests/fixtures/pi-v0.80.0/traces

      - name: Upload differential traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-v0.80.0-differential-traces
          path: build/reference-traces
          if-no-files-found: warn
